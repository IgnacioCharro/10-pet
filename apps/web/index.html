<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icons/favicon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Un solo meta que el script de abajo pisa, en vez de los dos con
      media=(prefers-color-scheme) que sugiere el handoff: aca el tema lo elige
      el usuario y queda en localStorage, asi que la media query se equivocaria
      con quien forzo claro teniendo el sistema en oscuro.
    -->
    <meta name="theme-color" content="#7c3aed" />
    <!--
      Sincrono y sin type=module a proposito: tiene que correr antes del primer
      pintado. Si esperara a React, quien fijo el tema oscuro veria un flash
      blanco en cada carga.
    -->
    <script>
      (function () {
        var stored = null
        try { stored = localStorage.getItem('10pet:theme') } catch (e) { /* modo privado */ }
        var dark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) {
          document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#161614')
        }
      })()
    </script>
    <meta name="description" content="Plataforma de rescate animal para Argentina" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="10Pet" />
    <title>10Pet — Rescate Animal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
